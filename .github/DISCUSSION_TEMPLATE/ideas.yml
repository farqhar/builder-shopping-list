# Form shown when someone starts a discussion in the "Ideas" category.
# The file name must match the category's slug.
# Docs: https://docs.github.com/en/discussions/managing-discussions-for-your-community/creating-discussion-category-forms
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for a new checklist, guide or skill, or a way to make this
        repo more useful? Share it here. (To suggest a single checklist item
        with a source, the **Suggest an item** issue form is faster.)
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you add or change?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What were you trying to do when you wished this existed?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Any official docs that back this up? (optional)
      placeholder: "https://"
